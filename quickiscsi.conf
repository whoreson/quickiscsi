; quickiscsi.conf -- test configuration

[global]

; Ramdisk target - good for testing, volatile
[target "ramdisk"]
iqn     = iqn.homelab:ramdisk
backend = ramdisk
size    = 768MB

; File-backed target on Pi's local tmpfs (fast, volatile)
[target "data"]
iqn     = iqn.homelab:data
backend = file
path    = /tmp/test_disk.img
size    = 1G

